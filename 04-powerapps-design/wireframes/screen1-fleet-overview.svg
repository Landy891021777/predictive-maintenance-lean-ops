    <g>
      <rect x="16" y="394" width="348" height="52" rx="6" fill="#fff" stroke="#c9ced6"/>
      <circle cx="36" cy="420" r="7" fill="#2e8b57"/>
      <text x="54" y="416" fill="#111" font-weight="bold">ENG-039</text>
      <text x="54" y="434" fill="#6b7280" font-size="11">警告率 0.0% · 最新 cycle 37</text>
      <text x="330" y="424" fill="#2e8b57" font-size="12" text-anchor="end">Healthy ›</text>
    </g>
    <g>
      <rect x="16" y="452" width="348" height="52" rx="6" fill="#fff" stroke="#c9ced6"/>
      <circle cx="36" cy="478" r="7" fill="#2e8b57"/>
      <text x="54" y="474" fill="#111" font-weight="bold">ENG-096</text>
      <text x="54" y="492" fill="#6b7280" font-size="11">警告率 0.0% · 最新 cycle 97</text>
