      <text x="54" y="318" fill="#6b7280" font-size="11">警告率 22.3% · 最新 cycle 184</text>
      <text x="330" y="308" fill="#c0392b" font-size="12" text-anchor="end">Warning ›</text>
    </g>
    <g>
      <rect x="16" y="336" width="348" height="52" rx="6" fill="#fff" stroke="#c9ced6"/>
      <circle cx="36" cy="362" r="7" fill="#c0392b"/>
