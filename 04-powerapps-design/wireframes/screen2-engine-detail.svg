<svg xmlns="http://www.w3.org/2000/svg" width="380" height="680" viewBox="0 0 380 680" font-family="Segoe UI, Arial, sans-serif">
  <rect width="380" height="680" fill="#f4f5f7" stroke="#c9ced6"/>
  <!-- App bar -->
  <rect width="380" height="56" fill="#1f4e78"/>
  <text x="20" y="34" fill="#fff" font-size="18">‹</text>
  <text x="40" y="34" fill="#fff" font-size="17" font-weight="bold">ENG-034 · 健康明細</text>
  <!-- Status banner -->
  <rect x="16" y="72" width="348" height="88" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <circle cx="56" cy="116" r="20" fill="#c0392b"/>
  <text x="56" y="122" fill="#fff" font-size="18" text-anchor="middle" font-weight="bold">!</text>
  <text x="92" y="106" fill="#c0392b" font-size="20" font-weight="bold">Warning</text>
  <text x="92" y="130" fill="#7a2a20" font-size="12">最近的 support 樣本屬「高風險群」</text>
  <text x="92" y="148" fill="#7a2a20" font-size="12">潛空間 z = (−1.00, 1.79)</text>
  <!-- Metric cards -->
  <g>
    <rect x="16" y="174" width="168" height="72" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="30" y="198" fill="#6b7280" font-size="11">最新 Cycle</text>
    <text x="30" y="226" fill="#111" font-size="24" font-weight="bold">203</text>
    <rect x="196" y="174" width="168" height="72" rx="8" fill="#fff" stroke="#c9ced6"/>
    <text x="210" y="198" fill="#6b7280" font-size="11">近30筆警告率</text>
    <text x="210" y="226" fill="#c0392b" font-size="24" font-weight="bold">16.3%</text>
  </g>
  <!-- Trend sparkline -->
  <rect x="16" y="260" width="348" height="150" rx="8" fill="#fff" stroke="#c9ced6"/>
  <text x="30" y="284" fill="#6b7280" font-size="12">健康分數趨勢（近 30 個 cycle）</text>
  <polyline points="30,300 60,304 90,306 120,312 150,318 180,326 210,336 240,350 270,364 300,378 340,392"
            fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="30" y1="392" x2="352" y2="392" stroke="#e0e0e0"/>
  <text x="30" y="405" fill="#9aa2ad" font-size="10">新 →→→ 舊（越往右越接近故障）</text>
  <!-- Recommended action -->
  <rect x="16" y="424" width="348" height="96" rx="8" fill="#fff" stroke="#c9ced6"/>
  <text x="30" y="448" fill="#111" font-size="13" font-weight="bold">建議行動</text>
  <text x="30" y="472" fill="#374151" font-size="12">• 安排 72 小時內檢查（RUL 預警窗）</text>
  <text x="30" y="492" fill="#374151" font-size="12">• 通知物料端預備備品</text>
  <text x="30" y="512" fill="#374151" font-size="12">• 產生工單 WO-XXXXXX</text>
  <!-- Buttons -->
  <rect x="16" y="534" width="168" height="44" rx="8" fill="#1f4e78"/>
  <text x="100" y="562" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">建立工單</text>
  <rect x="196" y="534" width="168" height="44" rx="8" fill="#fff" stroke="#1f4e78"/>
  <text x="280" y="562" fill="#1f4e78" font-size="13" text-anchor="middle" font-weight="bold">標記已檢查</text>
  <!-- Bottom nav -->
  <rect x="0" y="624" width="380" height="56" fill="#fff" stroke="#c9ced6"/>
  <text x="63" y="656" fill="#9aa2ad" font-size="12" text-anchor="middle">■ 總覽</text>
  <text x="190" y="656" fill="#9aa2ad" font-size="12" text-anchor="middle">◐ 查詢</text>
  <text x="317" y="656" fill="#9aa2ad" font-size="12" text-anchor="middle">↻ 趨勢</text>
  <text x="190" y="600" fill="#9aa2ad" font-size="10" text-anchor="middle">畫面 2 / 3 — 單台健康明細（線框圖）</text>
</svg>
